# Blueprint de Render: crea la base de datos, la API y la web con un clic.
# Render > New > Blueprint > este repositorio. Cada push a main vuelve a desplegar lo que cambió.
databases:
  - name: schooltrack-db
    plan: basic-256mb
    region: ohio
    databaseName: schooltrack
    user: schooltrack

services:
  - type: web
    name: schooltrack-api
    runtime: docker
    plan: starter
    region: ohio
    rootDir: Backend/TransporteEscolarAPI
    dockerfilePath: ./Dockerfile
    healthCheckPath: /WeatherForecast
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # La API convierte esta URL al formato de Npgsql (ver Program.cs)
      - key: DATABASE_URL
        fromDatabase:
          name: schooltrack-db
          property: connectionString
      # Reemplaza la clave JWT de appsettings.json (que está publicada en el repositorio)
      - key: JwtSettings__Key
        generateValue: true
      # Usuario IAM con permisos solo de Rekognition: se escriben a mano en el panel de Render
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2

  - type: web
    name: schooltrack-web
    runtime: static
    rootDir: Frontend/transporte-escolar-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Dirección pública de la API (fromService solo entrega el nombre interno, que el navegador no alcanza)
      - key: VITE_API_URL
        value: https://schooltrack-api-noyk.onrender.com/api
    # React Router: cualquier ruta (/admin, /login...) se sirve con index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
